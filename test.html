<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAI Pro — Multi-pathway flow v2 (onboarding · teacher · school admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1A56DB; --primary-soft:#EFF4FE; --primary-300:#1A56DB;
  --ink:#111827; --gray-900:#111827; --gray-600:#4B5563; --gray-500:#6B7280; --gray-400:#9CA3AF;
  --border:rgb(229,231,235); --divider:rgb(243,244,246); --bg:#F9FAFC;
  --ok-fg:rgb(22,163,74); --ok-bg:rgb(220,252,231);
  --warn-fg:rgb(180,83,9); --warn-bg:rgb(254,243,199);
  --info-fg:rgb(26,86,219); --info-bg:rgb(219,234,254);
  --red-fg:rgb(185,28,28); --red-bg:rgb(254,226,226);
  --shadow:rgba(0,0,0,.06) 0 4px 24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Work Sans","Montserrat",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Montserrat","Work Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
table{border-collapse:collapse;width:100%}

/* sim bar */
.simbar{background:#0F172A;color:#CBD5E1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 16px;font-size:12px;position:sticky;top:0;z-index:60}
.simbar .tag{background:#1E293B;border-radius:5px;padding:3px 8px;font-weight:600;color:#94A3B8}
.simbar select{background:#1E293B;color:#E2E8F0;border:1px solid #334155;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit}
.simbar .sb-btn{background:#1E293B;border:1px solid #334155;border-radius:6px;padding:5px 10px;color:#E2E8F0;font-size:12px}
.simbar .sb-btn:hover{background:#334155}
.simbar .sb-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.simbar .spacer{flex:1}
.simbar .step{color:#64748B}

.shell{max-width:1280px;margin:0 auto;padding:0 16px 90px}
header.top{display:flex;align-items:center;gap:20px;padding:14px 4px}
.logo{font-family:"Montserrat",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;border:2px solid var(--ink);border-radius:8px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
.logo .ai{background:#1A56DB;color:#fff;border-radius:4px;font-size:11px;padding:1px 4px}
.logo .pro{font-size:13px}
nav.tabs{display:flex;gap:4px;margin:0 auto}
.tab{display:flex;align-items:center;gap:8px;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:500;color:var(--gray-500)}
.tab:hover{background:#fff}
.tab.on{background:#EEF5FF;border:1px solid #AFCAFC;color:#0043BE;font-weight:600}
.logout{border:1px solid #DBDBDB;background:#fff;border-radius:9px;padding:9px 12px;color:#FF0000}

.page-h{font-size:26px;font-weight:700;color:var(--gray-900);letter-spacing:-.015em}
.page-sub{font-size:14px;color:var(--gray-500);margin-top:4px}

.section{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.section-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--divider)}
.icon-tile{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.section-head h4{font-size:14px;font-weight:700;color:var(--gray-900)}
.section-head p{font-size:11px;color:var(--gray-500);margin-top:2px}
.section-body{padding:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card-media{position:relative;width:100%;height:160px;background:#F3F4F6;overflow:hidden}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:600;border-radius:999px;padding:4px 10px}
.b-ok{color:var(--ok-fg);background:var(--ok-bg)}
.b-warn{color:var(--warn-fg);background:var(--warn-bg)}
.b-info{color:var(--info-fg);background:var(--info-bg)}
.b-red{color:var(--red-fg);background:var(--red-bg)}
.card-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.card-title{font-size:13px;font-weight:600;color:var(--gray-900);text-transform:capitalize;line-height:1.35}
.certno{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--gray-400)}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.meta .k{color:var(--gray-400)} .meta .v{color:var(--gray-600);font-weight:500;display:flex;align-items:center;gap:4px}
.card-note{font-size:10.5px;color:var(--gray-500);line-height:1.55}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:8px;font-size:14px;font-weight:500;padding:10px 12px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--primary);color:#fff;box-shadow:inset -1px -2px 3px rgba(0,0,0,.15)}
.btn-p:hover{background:#1749bd}
.btn-q{background:#fff;border:1px solid #DBDBDB;color:var(--gray-600)}
.btn-q:hover{background:#F9FAFB}
.btn-full{width:100%} .btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{font-size:12px;padding:8px 10px}

.add-tile{border:1px dashed #CBD5E1;border-radius:12px;background:#fff;min-height:288px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;transition:border-color .15s,background .15s}
.add-tile:hover{border-color:var(--primary);background:#F7FAFF}
.add-tile h3{font-size:13px;font-weight:600;color:var(--gray-900)}
.add-tile p{font-size:10.5px;color:var(--gray-500);line-height:1.5;max-width:200px}
.add-tile .go{font-size:11px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:5px}

/* certificate artwork */
.cert-art{width:100%;height:100%;background:#F1EEE6;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:"Times New Roman",Georgia,serif;color:#1F2A54;padding:10px 26px}
.cert-art::before,.cert-art::after{content:"";position:absolute;top:6px;bottom:6px;width:5px;border-left:2px solid #2B3A6B;border-right:1px solid #2B3A6B}
.cert-art::before{left:14px}.cert-art::after{right:14px}
.cert-art .ct{font-size:17px;letter-spacing:.10em;font-weight:600}
.cert-art .cs{font-size:6.5px;letter-spacing:.28em;text-transform:uppercase;color:#41508A}
.cert-art .cp{font-size:7px;font-style:italic;color:#41508A;margin-top:2px}
.cert-art .cn{font-family:"Brush Script MT","Segoe Script",cursive;font-size:19px;border-bottom:1px solid #2B3A6B;padding:0 22px 1px;line-height:1.15}
.cert-art .cl{font-size:6.5px;font-style:italic;text-align:center;line-height:1.5;margin-top:3px;max-width:210px}
.cert-art .qr{position:absolute;right:26px;bottom:16px;width:26px;height:26px;background:repeating-linear-gradient(0deg,#1F2A54 0 2px,#F1EEE6 2px 4px),repeating-linear-gradient(90deg,#1F2A54 0 2px,transparent 2px 4px)}
.cert-art.blurred{filter:blur(6px);transform:scale(1.06);opacity:.7}
.lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lock-puck{width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#374151;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* pathway cards */
.p-card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;transition:box-shadow .18s,border-color .15s}
.p-card:hover:not(.locked){box-shadow:0 4px 14px rgba(0,0,0,.08)}
.p-card.sel{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.p-card.locked{opacity:.62;cursor:default}
.p-card h3{font-size:13px;font-weight:600;color:var(--gray-900)}
.p-card .desc{font-size:10.5px;color:var(--gray-500);line-height:1.55}
.p-card .foot{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--gray-400);padding-top:2px}
.p-card .gate{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--gray-500)}
.p-badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:600;border-radius:999px;padding:4px 10px}

/* PDP */
.switcher{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.sw{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;font-size:11px;font-weight:500;color:var(--gray-600)}
.sw .pc{color:var(--gray-400);margin-left:6px}
.sw.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.sw.on .pc{color:rgba(255,255,255,.72)}
.prog-wrap{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--gray-600);margin-bottom:8px}
.prog-wrap b{color:var(--primary)}
.bar{height:8px;border-radius:999px;background:#E5E7EB;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.sm{height:6px}
.legend{display:flex;gap:18px;font-size:11px;color:var(--gray-500);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:999px;border:2px solid currentColor}
.unit{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}
.unit .n{width:34px;height:34px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.unit .t{flex:1} .unit .t b{display:block;font-size:13px;font-weight:600;color:var(--gray-900)} .unit .t span{font-size:11px;color:var(--gray-400)}
.upill{font-size:10px;font-weight:600;border-radius:999px;padding:4px 10px}

.disclose{border:1px solid var(--border);background:#fff;border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.disclose.blue{background:var(--primary-soft);border-color:#D5E2FB}
.disclose.amber{background:#FFFBEB;border-color:#FDE68A}
.disclose p{font-size:11.5px;color:var(--gray-600);line-height:1.6}
.disclose .ttl{font-size:12px;font-weight:600;color:var(--gray-900);display:block;margin-bottom:2px}
.disclose .act{margin-left:auto;flex:0 0 auto}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;animation:fade .16s ease-out;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:12px;width:100%;max-width:436px;box-shadow:var(--shadow);overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1);margin:auto}
.modal.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--divider)}
.modal-head h4{font-size:14px;font-weight:700;color:var(--gray-900)}
.modal-head p{font-size:11px;color:var(--gray-500);margin-top:2px}
.modal-head .x{margin-left:auto;color:var(--gray-400);padding:2px}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.lead{font-size:12px;color:var(--gray-600);line-height:1.65}
.plan{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.plan .row{display:flex;align-items:baseline;justify-content:space-between}
.plan .row b{font-size:13px;font-weight:600;color:var(--gray-900)}
.plan .row .pr{font-size:13px;font-weight:600;color:var(--gray-900)}
.plan .row .pr small{font-size:11px;font-weight:400;color:var(--gray-400)}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;gap:8px;font-size:11px;color:var(--gray-600);line-height:1.55}
.plan li svg{flex:0 0 auto;margin-top:1px;color:var(--primary)}
.fineprint{font-size:10.5px;color:var(--gray-400);line-height:1.6}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:500;color:var(--gray-600)}
.field input,.field select{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--gray-900);background:#fff}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.simnote{font-size:10.5px;color:var(--warn-fg);background:var(--warn-bg);border-radius:8px;padding:8px 10px;line-height:1.55}

.success-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 0}
.tick{width:54px;height:54px;border-radius:999px;background:var(--ok-bg);color:var(--ok-fg);display:flex;align-items:center;justify-content:center}
.success-wrap h3{font-size:16px;font-weight:600;color:var(--gray-900)}
.success-wrap p{font-size:12px;color:var(--gray-500);line-height:1.65;max-width:320px}

#toasts{position:fixed;right:16px;bottom:56px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:330px}
.toast{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.12);padding:12px 14px;display:flex;gap:9px;animation:slide .22s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast b{display:block;font-size:12px;font-weight:600;color:var(--gray-900);margin-bottom:2px}
.toast span{font-size:11px;color:var(--gray-500);line-height:1.55}

/* api log */
#log{position:fixed;right:0;bottom:0;width:min(440px,100%);background:#0F172A;color:#CBD5E1;border-top-left-radius:12px;z-index:70;transform:translateY(calc(100% - 38px));transition:transform .25s;font-size:11.5px}
#log.open{transform:translateY(0)}
#log .lh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600;color:#E2E8F0;cursor:pointer;border-bottom:1px solid #1E293B}
#log .lh .count{background:#1E293B;border-radius:999px;padding:2px 8px;font-size:10px;color:#94A3B8}
#log .lb{max-height:280px;overflow:auto;padding:10px 14px;font-family:ui-monospace,Menlo,monospace}
.le{padding:7px 0;border-bottom:1px solid #1E293B;line-height:1.6}
.le:last-child{border-bottom:0}
.le .m{font-weight:700;margin-right:6px}
.m-GET{color:#38BDF8}.m-POST{color:#4ADE80}.m-PATCH{color:#FBBF24}.m-UI{color:#A78BFA}
.le .u{color:#E2E8F0} .le .r{display:block;color:#94A3B8;margin-top:2px}
.le .s402{color:#FB923C;font-weight:700} .le .s201,.le .s200{color:#4ADE80;font-weight:700} .le .s409{color:#F87171;font-weight:700}

/* onboarding */
.ob-scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.ob-card{background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);width:100%;max-width:576px;padding:24px;margin:auto}
.ob-card .head{border-bottom:1px solid var(--divider);padding-bottom:14px;margin-bottom:20px}
.ob-card .pill{width:40px;height:40px;border-radius:999px;background:rgba(147,197,253,.18);display:flex;align-items:center;justify-content:center;color:var(--primary);margin-bottom:12px}
.ob-card h3{font-size:18px;font-weight:600;color:#000;margin-bottom:4px}
.ob-card .sub{font-size:14px;color:#000;line-height:1.5}
.ob-steps{display:flex;gap:6px;margin-bottom:18px}
.ob-steps i{height:4px;flex:1;border-radius:999px;background:#E5E7EB}
.ob-steps i.on{background:var(--primary)}
.ob-fields{display:flex;flex-direction:column;gap:16px}
.ob-actions{display:flex;gap:12px;margin-top:24px}
.ob-actions .btn{flex:1}
.role-btn{width:100%;border:1px solid var(--border);border-radius:6px;padding:12px;display:flex;align-items:center;gap:12px;transition:background .3s}
.role-btn:hover{background:rgba(59,130,246,.08)}
.role-btn .ic{border-radius:999px;background:rgba(147,197,253,.14);padding:8px;display:flex;color:var(--primary)}
.role-btn h3{font-size:16px;font-weight:500;color:#000}
.pathway-confirm{border:1px solid #AFCAFC;background:#EEF5FF;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px}
.pathway-confirm .txt{flex:1}
.pathway-confirm .lbl{font-size:11px;color:var(--gray-500);display:block;margin-bottom:2px}
.pathway-confirm .val{font-size:14px;font-weight:600;color:#0043BE}
.pathway-confirm .why{font-size:10.5px;color:var(--gray-500);margin-top:3px;line-height:1.5}

/* admin */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;color:var(--gray-900)}
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
thead tr{background:#F4F4F4}
th{height:40px;padding:8px 12px;text-align:left;white-space:nowrap;font-size:12px;font-weight:600;color:var(--gray-500)}
tbody tr{border-bottom:1px solid var(--divider);height:56px;cursor:pointer;transition:background .12s}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:#FAFBFF}
td{padding:8px 12px;white-space:nowrap;font-size:13px;color:var(--gray-600)}
td .nm{font-weight:600;color:var(--gray-900)}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}

/* chip tooltip */
.tipwrap{position:relative;display:inline-flex}
.tipwrap .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:#0F172A;color:#E2E8F0;border-radius:8px;padding:9px 11px;width:236px;
  font-size:11px;line-height:1.55;white-space:normal;text-align:left;font-weight:400;
  opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:40;
  box-shadow:0 8px 24px rgba(0,0,0,.24);
}
.tipwrap .tip b{display:block;font-weight:600;color:#fff;margin-bottom:3px;font-size:11.5px}
.tipwrap .tip .st{display:inline-flex;align-items:center;gap:5px;color:#94A3B8;margin-top:5px;font-size:10.5px}
.tipwrap .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#0F172A}
.tipwrap:hover .tip,.tipwrap:focus-within .tip{opacity:1;transform:translateX(-50%) translateY(0)}
tbody tr:first-child .tipwrap .tip{bottom:auto;top:calc(100% + 8px)}
tbody tr:first-child .tipwrap .tip::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#0F172A}
.chip-key{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--gray-500);
  padding:10px 14px;background:#fff;border:1px solid var(--border);border-bottom:0;border-radius:12px 12px 0 0}
.chip-key .it{display:flex;align-items:center;gap:6px}
.chip-key b{color:var(--gray-600);font-weight:600}

/* profile */
.hero{position:relative;overflow:hidden;border-radius:14px;padding:28px;margin-bottom:22px;
  background:linear-gradient(135deg,rgb(239,246,255) 0%,rgb(248,250,255) 55%,rgb(255,255,255) 100%);
  border:1px solid var(--border)}
.hero .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.avatar{width:100px;height:100px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;
  color:#CBD5E1;box-shadow:0 4px 20px rgba(26,86,219,.18);outline:4px solid #fff;flex:0 0 auto;position:relative}
.avatar .camera{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:999px;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;outline:2px solid #fff}
.hero h2{font-size:19px;font-weight:700;color:#1F2937}
.hero .em{font-size:14px;font-weight:500;color:var(--gray-500);margin-top:2px}

<script>

  const base={route:'certificates',plan:'free',grandfathered:false,activeId:'e1',enrollments:[],certificates:[],pending:[]};
  const he={id:'e1',pathwayId:'he',status:'completed',progress:100,unit:12,startedAt:new Date(2026,2,12),completedAt:issued};
  if(kind==='legacy') return {...base,grandfathered:true,enrollments:[he],
    certificates:[{id:'c1',enrollmentId:'e1',pathwayId:'he',no:'aupmLvBN3I',issuedOn:issued,validTill:until}]};
  if(kind==='free') return {...base,enrollments:[he],pending:[{enrollmentId:'e1',pathwayId:'he',completedOn:issued}]};

    certificates:[{id:'c1',enrollmentId:'e1',pathwayId:'he',no:'aupmLvBN3I',issuedOn:issued,validTill:until}]};

/* ===== log / toast ===== */
function log(method,url,body,status,note){
  logs.unshift({method,url,body,status,note});
  document.getElementById('logCount').textContent=logs.length;
  document.getElementById('logBody').innerHTML=logs.map(l=>`<div class="le">
    <span class="m m-${l.method}">${l.method}</span><span class="u">${l.url}</span>
    ${l.body?`<span class="r">→ ${l.body}</span>`:''}
    ${l.status?`<span class="r">← <span class="s${l.status}">${l.status}</span> ${l.note||''}</span>`:(l.note?`<span class="r">${l.note}</span>`:'')}</div>`).join('');
}
function toast(t,m,ms=6000){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span style="color:var(--primary);flex:0 0 auto;margin-top:1px">${svg('info',15)}</span><div><b>${t}</b><span>${m}</span></div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),320)},ms);
}

function viewDashboard(){
  const e=ent(),a=S.enrollments.find(x=>x.id===S.activeId)||S.enrollments[0],path=pw(a.pathwayId);
  const sw=S.enrollments.length>1?`<div class="switcher">${S.enrollments.map(en=>
    `<button class="sw ${en.id===S.activeId?'on':''}" data-act="switch" data-e="${en.id}">${pw(en.pathwayId).short}
      <span class="pc">${en.status==='completed'?'Completed':en.progress+'%'}</span></button>`).join('')}</div>`:'';
  const gated=!e.canIssueCertificate(a.id);
  let d='';
  if(gated&&a.status!=='completed'){
    if(a.progress>=90) d=`<div class="disclose amber"><span style="color:var(--warn-fg);flex:0 0 auto;margin-top:1px">${svg('lock',16)}</span>
      <div><span class="ttl">Almost there — one thing to set up</span><p>You're on the final unit. Issuing your ${path.short} certificate needs an active subscription. Set it up now so it's ready the moment you finish.</p></div>
      <div class="act"><button class="btn btn-p btn-sm" data-act="issue" data-enrol="${a.id}">Subscribe</button></div></div>`;
    else if(a.progress>=45) d=`<div class="disclose blue"><span style="color:var(--primary);flex:0 0 auto;margin-top:1px">${svg('info',16)}</span>
      <div><span class="ttl">You're past halfway</span><p>All ${path.short} course content stays free. Your certificate will need an active subscription when you finish.</p></div></div>`;
    else d=`<div class="disclose"><span style="color:var(--gray-400);flex:0 0 auto;margin-top:1px">${svg('lock',15)}</span>
      <p>All course content is free on your current plan. A subscription is needed to issue the certificate at the end.</p></div>`;
  }
  if(a.status==='completed'&&!S.certificates.find(c=>c.enrollmentId===a.id)){
    d=gated?`<div class="disclose amber"><span style="color:var(--warn-fg);flex:0 0 auto;margin-top:1px">${svg('shield',16)}</span>
      <div><span class="ttl">Pathway complete — your certificate is ready</span><p>Subscribe to issue and download your ${path.short} certificate.</p></div>
      <div class="act"><button class="btn btn-p btn-sm" data-act="issue" data-enrol="${a.id}">Subscribe to issue</button></div></div>`
     :`<div class="disclose blue"><span style="color:var(--primary);flex:0 0 auto;margin-top:1px">${svg('shield',16)}</span>
      <div><span class="ttl">Pathway complete</span><p>Your ${path.short} certificate is ready to issue.</p></div>
      <div class="act"><button class="btn btn-p btn-sm" data-act="issue" data-enrol="${a.id}">Issue certificate</button></div></div>`;
  }
  const units=Array.from({length:4},(_,i)=>{
    const n=a.status==='completed'?i+1:Math.max(1,a.unit-1)+i; if(n>12)return '';
    const done=n<a.unit||a.status==='completed',cur=n===a.unit&&a.status!=='completed';
    const pill=done?`<span class="upill" style="color:var(--ok-fg);background:var(--ok-bg)">Completed</span>`
      :cur?`<span class="upill" style="color:var(--info-fg);background:var(--info-bg)">In progress</span>`
      :`<span class="upill" style="color:var(--gray-500);background:#F3F4F6">Locked</span>`;
    return `<div class="unit"><div class="n">${String(n).padStart(2,'0')}</div>
      <div class="t"><b>Unit ${n}</b><span>${done||cur?'Available':'Locked'}</span></div>${pill}</div>`;}).join('');
  const adv=a.status!=='completed'?`<div style="display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--divider);margin-top:16px;flex-wrap:wrap">
    <button class="btn btn-q btn-sm" data-act="next">Complete next unit</button>
    <button class="btn btn-q btn-sm" data-act="finish">Jump to pathway completion</button>
    <span style="font-size:10.5px;color:var(--gray-400);align-self:center">Simulation shortcuts</span></div>`:'';
  return `<div style="margin-bottom:20px"><h2 class="page-h">${path.name}</h2>
    <p class="page-sub">Continuing professional development · CPD Accredited</p></div>${sw}${d}
    <section class="section"><div class="section-head"><div class="icon-tile">${svg('cap',20)}</div>
      <div><h4>Course content</h4><p>12 units · CPD Accredited</p></div></div>
      <div class="section-body">
        <div class="prog-wrap"><span>Overall progress</span><b>Unit ${Math.min(a.unit,12)} of 12 · ${a.progress}%</b></div>
        <div class="bar"><i style="width:${a.progress}%"></i></div>
        <div class="legend"><span style="color:var(--ok-fg)"><i class="dot"></i>Completed</span>
          <span style="color:var(--primary)"><i class="dot"></i>In progress</span>
          <span style="color:var(--gray-400)"><i class="dot"></i>Locked</span></div>
        <div style="margin-top:18px">${units}</div>${adv}</div></section>`;
}

function chipTip(t,e){
  const p=pw(e.pathwayId);
  const cert=(t.certificates||[]).find(c=>c.pathwayId===e.pathwayId);
  if(e.status==='completed'){
    return `<span class="tip"><b>${p.name}</b>
      All 12 units and assessments finished on ${fmt(e.completedAt)}.
      ${cert?`Certificate ${cert.no} issued, valid to ${fmt(cert.validTill)}.`
            :`<span style="color:#FCD34D">No certificate issued — the teacher is on a free plan.</span>`}
      <span class="st">✓ means the pathway is complete</span></span>`;
  }
  return `<span class="tip"><b>${p.name}</b>
    Currently on unit ${Math.max(1,Math.round(e.progress/100*12))} of 12 · ${e.progress}% complete.
    Started ${fmt(e.startedAt)}. No certificate until all units are finished.
    <span class="st">● means the pathway is in progress</span></span>`;
}
function pathChips(t){
  const c=t.enrollments||[];
  const shown=c.slice(0,2).map(e=>`<span class="tipwrap" tabindex="0">
    <span class="chip ${e.status==='completed'?'c-done':'c-prog'}">${pw(e.pathwayId).short} ${e.status==='completed'?'✓':'●'}</span>
    ${chipTip(t,e)}</span>`).join('');
  const rest=c.slice(2);
  const more=rest.length?`<span class="tipwrap" tabindex="0"><span class="chip c-more">+${rest.length}</span>
    <span class="tip"><b>${rest.length} more pathway${rest.length>1?'s':''}</b>
    ${rest.map(e=>`${pw(e.pathwayId).name} — ${e.status==='completed'?'complete':e.progress+'%'}`).join('<br>')}
    <span class="st">Open the row for the full record</span></span></span>`:'';
  return `<div class="chips">${shown||'<span style="color:var(--gray-400)">—</span>'}${more}</div>`;
}
function planPill(t){
  const m={free:['pp-free','Free'],pro:['pp-pro','EduAI Pro'],school:['pp-school','School seat']};
  const [c,l]=m[t.plan]||m.free; return `<span class="plan-pill ${c}">${l}</span>`;
}
function earliestExpiry(t){
  const cs=t.certificates||[]; if(!cs.length) return null;
  return cs.map(c=>c.validTill).sort((a,b)=>a-b)[0];
}
function daysTo(d){return Math.round((d-new Date(2026,8,6))/86400000);}

function viewAdminRoster(){
  let list=roster();
  if(filters.q){const q=filters.q.toLowerCase();list=list.filter(t=>t.name.toLowerCase().includes(q)||t.email.toLowerCase().includes(q));}
  if(filters.pathway) list=list.filter(t=>(t.enrollments||[]).some(e=>e.pathwayId===filters.pathway));
  if(filters.certs==='0') list=list.filter(t=>(t.certificates||[]).length===0);
  if(filters.certs==='1') list=list.filter(t=>(t.certificates||[]).length===1);
  if(filters.certs==='2') list=list.filter(t=>(t.certificates||[]).length>=2);

  const all=roster();
  const totalEnrol=all.reduce((n,t)=>n+(t.enrollments||[]).length,0);
  const totalCerts=all.reduce((n,t)=>n+(t.certificates||[]).length,0);
  const multi=all.filter(t=>(t.enrollments||[]).length>1).length;
  const expiring=all.flatMap(t=>(t.certificates||[]).map(c=>({t,c}))).filter(x=>daysTo(x.c.validTill)<90).sort((a,b)=>a.c.validTill-b.c.validTill);

  const rows=list.map(t=>{
    const act=(t.enrollments||[]).find(e=>e.status!=='completed')||(t.enrollments||[])[0];
    const exp=earliestExpiry(t);
    return `<tr data-act="teacher" data-t="${t.id}">
      <td><span class="nm">${t.name}</span></td>
      <td>${t.email}</td>
      <td>${pathChips(t)}</td>
      <td>${act?`<div class="miniprog"><div class="bar sm"><i style="width:${act.progress}%"></i></div>
             <span>${act.progress}% · ${pw(act.pathwayId).short}</span></div>`:'<span style="color:var(--gray-400)">—</span>'}</td>
      <td>${(t.certificates||[]).length}${exp?`<span style="color:var(--gray-400);font-size:11px"> · exp ${fmt(exp)}</span>`:''}</td>
      <td>${planPill(t)}</td>
      <td><div class="statusdot"><i></i><span style="text-transform:capitalize">${t.status}</span></div></td>
    </tr>`;}).join('');

  return `<div style="margin-bottom:22px"><h2 class="page-h">Teachers</h2>
    <p class="page-sub">Enrolments and credentials across your school.</p></div>

    <div class="stat-row">
      <div class="stat"><div class="k">Teachers</div><div class="v">${all.length}</div><div class="n">on your seats</div></div>
      <div class="stat"><div class="k">Enrolments</div><div class="v">${totalEnrol}</div><div class="n">${multi} teacher(s) on more than one</div></div>
      <div class="stat"><div class="k">Certificates issued</div><div class="v">${totalCerts}</div><div class="n">across all pathways</div></div>
      <div class="stat"><div class="k">Expiring in 90 days</div><div class="v" style="color:${expiring.length?'var(--warn-fg)':'var(--gray-900)'}">${expiring.length}</div><div class="n">needs a refresher</div></div>
    </div>

    <div class="filters">
      <input id="f-q" placeholder="Search teacher" value="${filters.q}" style="min-width:220px">
      <select id="f-path"><option value="">All pathways</option>
        ${PATHWAYS.map(p=>`<option value="${p.id}" ${filters.pathway===p.id?'selected':''}>${p.short}</option>`).join('')}</select>
      <select id="f-certs"><option value="">Any number of certificates</option>
        <option value="0" ${filters.certs==='0'?'selected':''}>0 certificates</option>
        <option value="1" ${filters.certs==='1'?'selected':''}>1 certificate</option>
        <option value="2" ${filters.certs==='2'?'selected':''}>2 or more</option></select>
      <span style="flex:1"></span>
      <button class="btn btn-q btn-sm" data-act="export">${svg('download',14)} Export CSV</button>
      <button class="btn btn-p btn-sm" data-act="invite">${svg('plus',14)} Invite teacher</button>
    </div>

    <div class="chip-key">
      <span class="it"><span class="chip c-done">Primary ✓</span> <b>Complete</b> — all 12 units finished</span>
      <span class="it"><span class="chip c-prog">Mentors ●</span> <b>In progress</b> — still working through the units</span>
      <span class="it"><span class="chip c-more">+2</span> <b>More</b> — hover any chip for detail</span>
    </div>
    <div class="tbl-wrap" style="border-radius:0 0 12px 12px"><div class="tbl-scroll"><table>
      <thead><tr>${['Name','Email','Pathways','Active progress','Certificates','Plan','Status'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows||'<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--gray-400)">No teachers match those filters</td></tr>'}</tbody>
    </table></div></div>
    <p style="font-size:11px;color:var(--gray-400);margin-top:10px">Click any row for the full enrolment record. Phone number and date joined moved into that panel.</p>

    <section class="section" style="margin-top:24px">
      <div class="section-head"><div class="icon-tile" style="background:var(--warn-bg);color:var(--warn-fg)">${svg('clock',20)}</div>
        <div><h4>Renewals due</h4><p>Listed per certificate, not per teacher — one teacher can hold several with different expiry dates</p></div></div>
      <div>${expiring.length?expiring.map(x=>{
        const dd=daysTo(x.c.validTill);
        return `<div class="renewal">
          <span class="chip ${dd<30?'':'c-more'}" style="${dd<30?'color:var(--red-fg);background:var(--red-bg)':''}">${dd<0?'Expired':dd+' days'}</span>
          <div class="who"><b>${x.t.name}</b><span>${pw(x.c.pathwayId).name} · ${x.c.no}</span></div>
          <span style="font-size:12px;color:var(--gray-500)">Valid till ${fmt(x.c.validTill)}</span>
        </div>`;}).join(''):'<div style="padding:26px;text-align:center;color:var(--gray-400);font-size:12px">Nothing expiring in the next 90 days</div>'}</div>
    </section>`;
}

function renderTabs(){
  const el=document.getElementById('tabs');
  if(mode==='onboarding'){el.innerHTML='';return;}
  const t=mode==='admin'
    ?[['a-dash','Dashboard','grid'],['a-teachers','Teachers','users'],['a-support','Support','head'],['a-settings','Settings','gear']]
    :[['dashboard','Personal Development Plan (PDP)','book'],['certificates','Certificates','badge'],['profile','Profile','user']];
  const cur=mode==='admin'?'a-teachers':S.route;
  el.innerHTML=t.map(([r,l,i])=>`<button class="tab ${cur===r?'on':''}" data-route="${r}">${svg(i,17)}<span>${l}</span></button>`).join('');
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(mode!=='admin')go(b.dataset.route);});
}
function go(r){S.route=r;
  log('UI','navigate → /dashboard'+(r==='dashboard'?'':'/'+r));
  if(r==='certificates')log('GET','/api/me/certificates',null,'200',`${S.certificates.length} issued, ${S.pending.length} pending`);
  if(r==='dashboard')log('GET','/api/me/enrollments',null,'200',`${S.enrollments.length} enrolment(s)`);
  render();}

/* ============================================================
   ACTIONS
   ============================================================ */
function handle(act,el){
  const e=ent();

  /* ---- onboarding ---- */
  if(act==='ob-role'){ob.role=el.dataset.p;ob.pathwayId=el.dataset.p;ob.step=1;
    log('POST','/api/auth/register',`{ "role": "${pw(ob.pathwayId).role}", "pathwayId": "${ob.pathwayId}" }`,'201','pathway written once, at sign-up');
    return render();}
  if(act==='ob-institution'){toast('Institution sign-up','That branch creates a school account, not a teacher pathway. Out of scope for this simulation.');return;}
  if(act==='ob-next'){
    if(ob.step===1){ob.dob=(document.getElementById('ob-dob')||{}).value||'';ob.loc=(document.getElementById('ob-loc')||{}).value||'';
      log('PATCH','/api/me/profile','{ "dob": "…", "location": "…" }','200','step 1 saved');}
    if(ob.step===2){ob.eduLevel=(document.getElementById('ob-edu')||{}).value||'';ob.spec=(document.getElementById('ob-spec')||{}).value||'';
      log('PATCH','/api/me/profile',`{ "educationalLevel": "…", "areaOfSpecialization": "…" }`,'200','no pathway write here — that is the change');}
    if(ob.step===3) log('PATCH','/api/me/profile','{ "skills": [...], "yearsExperience": "4-7" }','200','step 3 saved');
    ob.step++;return render();}
  if(act==='ob-prev'){ob.step--;return render();}
  if(act==='ob-change'){modal={kind:'pathpick'};return render();}
  if(act==='ob-setpath'){ob.pathwayId=el.dataset.p;modal=null;
    log('PATCH','/api/me/pathway',`{ "pathwayId": "${ob.pathwayId}" }`,'200','explicit override at onboarding');
    return render();}
  if(act==='ob-closepick'){modal=null;return render();}
  if(act==='ob-finish'){
    const p=pw(ob.pathwayId);
    log('POST','/api/me/enrollments',`{ "pathwayId": "${p.id}", "source": "onboarding" }`,'201','enrolment e1 created');
    S=scenarioState('free');
    S.enrollments=[{id:'e1',pathwayId:p.id,status:'in_progress',progress:0,unit:1,startedAt:new Date()}];
    S.pending=[];S.certificates=[];S.activeId='e1';S.route='dashboard';
    COHORT[0]={...COHORT[0],name:LEARNER};
    mode='teacher';ob=null;
    toast('Account ready',`You're enrolled in ${p.name}. Course content is free; the certificate needs a subscription.`);
    return render();}

  /* ---- teacher ---- */
  if(act==='pathways'){selectedPathway=null;
    log('UI','click "Earn another certificate"');
    log('GET','/api/pathways',null,'200','5 pathways · per-user status');
    log('GET','/api/me/subscription',null,'200',`plan=${S.plan} canAddPathway=${e.canAddPathway}`);
    S.route='pathways';return render();}
  if(act==='pick'){selectedPathway=el.dataset.p;return render();}
  if(act==='cancel'){selectedPathway=null;S.route='certificates';return render();}
  if(act==='enrol'){const p=pw(selectedPathway);
    log('POST','/api/me/enrollments',`{ "pathwayId": "${p.id}" }`,e.canAddPathway?'201':'402',
      e.canAddPathway?`enrolment e${S.enrollments.length+1} created`:'subscription required');
    if(!e.canAddPathway) return openM('subscribe',{reason:'add_pathway',pathwayName:p.name,pathwayId:p.id});
    return createEnrollment(p.id);}
  if(act==='issue'){const id=el.dataset.enrol,en=S.enrollments.find(x=>x.id===id),p=pw(en.pathwayId),ok=e.canIssueCertificate(id);
    log('POST',`/api/me/enrollments/${id}/certificate`,null,ok?'201':'402',ok?'certificate issued':'subscription required');
    if(!ok) return openM('subscribe',{reason:'issue_certificate',pathwayName:p.name,enrollmentId:id});
    return issueCert(id);}
  if(act==='pay'){log('POST','/api/billing/subscribe','{ "plan": "pro_yearly" }','200','checkout session created');
    return openM('payment',modal.ctx);}
  if(act==='confirmpay'){
    const b=document.getElementById('payBtn');b.textContent='Processing…';b.disabled=true;
    setTimeout(()=>{
      log('POST','/api/billing/webhook','{ "event": "subscription.activated" }','200','plan → pro');
      S.plan='pro';const ctx=modal.ctx;
      if(ctx.reason==='issue_certificate'){
        log('POST',`/api/me/enrollments/${ctx.enrollmentId}/certificate`,null,'201','auto-issued on activation');
        const c=mkCert(ctx.enrollmentId);
        openM('success',{title:'Subscription active',
          body:`Your ${pw(c.pathwayId).short} certificate has been issued and is ready to download.`,
          cta:'View my certificate',action:'go-certificates'});
      } else {
        log('POST','/api/me/enrollments',`{ "pathwayId": "${ctx.pathwayId}" }`,'201','retried after activation');
        const en=mkEnrol(ctx.pathwayId);
        log('PATCH','/api/me/active-enrollment',`{ "enrollmentId": "${en.id}" }`,'200','dashboard context switched');
        S.activeId=en.id;
        openM('success',{title:'Subscription active',
          body:`You're enrolled in ${pw(ctx.pathwayId).name}. Certificates you already hold are untouched and still valid.`,
          cta:'Start Unit 1',action:'go-dashboard'});
      }},1100);
    return;}
  if(act==='go-certificates'){modal=null;return go('certificates');}
  if(act==='go-dashboard'){modal=null;return go('dashboard');}
  if(act==='close'){modal=null;openTeacher=null;return render();}
  if(act==='switch'){const id=el.dataset.e;
    log('PATCH','/api/me/active-enrollment',`{ "enrollmentId": "${id}" }`,'200','dashboard context switched');
    S.activeId=id;return render();}
  if(act==='next'){const en=S.enrollments.find(x=>x.id===S.activeId);
    if(en.unit<12){en.unit++;en.progress=Math.round((en.unit-1)/12*100);}
    log('POST',`/api/me/enrollments/${en.id}/progress`,`{ "unit": ${en.unit} }`,'200',`${en.progress}%`);
    disclose(en);return render();}
  if(act==='finish'){const en=S.enrollments.find(x=>x.id===S.activeId);
    en.unit=12;en.progress=100;en.status='completed';en.completedAt=new Date();
    log('POST',`/api/me/enrollments/${en.id}/assessments/12`,'{ "score": 93 }','200','pathway complete');
    log('GET',`/api/me/enrollments/${en.id}/certificate/eligibility`,null,ent().canIssueCertificate(en.id)?'200':'402',
      ent().canIssueCertificate(en.id)?'eligible':'subscription required');
    toast('Pathway complete',`You finished ${pw(en.pathwayId).name}. Your certificate is ready to issue.`);
    return render();}
  if(act==='download'){const c=S.certificates.find(x=>x.id===el.dataset.cert);
    log('GET',`/api/certificates/${c.no}/download`,null,'200','application/pdf');
    toast('Certificate downloaded',`${pw(c.pathwayId).name} Accreditation · ${c.no}`);return;}

  /* ---- admin ---- */
  if(act==='teacher'){openTeacher=el.dataset.t;
    log('GET',`/api/school/teachers/${openTeacher}`,null,'200','profile + enrolments + certificates');
    return render();}
  if(act==='grant'){
    const tid=el.dataset.t,pid=el.dataset.p,t=COHORT.find(x=>x.id===tid);
    log('POST',`/api/school/teachers/${tid}/enrollments`,`{ "pathwayId": "${pid}", "source": "school_grant" }`,'201','seat entitlement covers issuance');
    if(t&&!t.self){(t.enrollments=t.enrollments||[]).push({pathwayId:pid,status:'in_progress',progress:0,startedAt:new Date()});
      t.plan='school';}
    else {toast('Use the teacher view','Row 1 is the teacher you control — add that pathway from the teacher side to see the full journey.');return;}
    toast('Pathway granted',`${t.name} is now enrolled in ${pw(pid).name}.`);return render();}
  if(act==='export'){log('GET','/api/school/enrollments/export.csv',null,'200','one row per enrolment');
    toast('Export queued','One row per enrolment — pathway, status, progress, certificate number and expiry.');return;}
  if(act==='invite'){toast('Invite teacher','The bulk-upload template needs a pathway column added — see QA-26.');return;}
  if(act==='message'){toast('Message sent','Not modelled in this simulation.');return;}
}

function disclose(en){
  if(ent().canIssueCertificate(en.id))return;
  if(en.progress>=45&&en.progress<55&&!seen[en.id+'h']){seen[en.id+'h']=1;
    toast("You're halfway",'Course content stays free. Your certificate will need an active subscription when you finish.');}
  if(en.progress>=90&&!seen[en.id+'n']){seen[en.id+'n']=1;
    toast('Final unit ahead','Set up your subscription now so your certificate issues the moment you finish.');}
}
function openM(k,c){modal={kind:k,ctx:c};render();}
function mkEnrol(pid){const en={id:'e'+(S.enrollments.length+1),pathwayId:pid,status:'in_progress',progress:0,unit:1,startedAt:new Date()};
  S.enrollments.push(en);return en;}
function createEnrollment(pid){const en=mkEnrol(pid);
  log('PATCH','/api/me/active-enrollment',`{ "enrollmentId": "${en.id}" }`,'200','dashboard context switched');
  S.activeId=en.id;
  openM('success',{title:"You're enrolled",body:`${pw(pid).name} is now on your dashboard. Your previous certificates are untouched.`,
    cta:'Start Unit 1',action:'go-dashboard'});}
function mkCert(eid){const en=S.enrollments.find(x=>x.id===eid),i=new Date(),u=new Date(i.getFullYear()+1,i.getMonth(),i.getDate()-5);
  const c={id:'c'+(S.certificates.length+1),enrollmentId:eid,pathwayId:en.pathwayId,no:Math.random().toString(36).slice(2,12),issuedOn:i,validTill:u};
  S.certificates.push(c);S.pending=S.pending.filter(p=>p.enrollmentId!==eid);return c;}
function issueCert(eid){const c=mkCert(eid);
  openM('success',{title:'Certificate issued',body:`${pw(c.pathwayId).name} Accreditation · ${c.no}. Valid until ${fmt(c.validTill)}.`,
    cta:'View my certificate',action:'go-certificates'});}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  renderTabs();
  const v=document.getElementById('view');
  v.innerHTML = mode==='onboarding' ? viewOnboarding()
    : mode==='admin' ? viewAdminRoster()
    : S.route==='certificates' ? viewCertificates()
    : S.route==='pathways' ? viewPathways()
    : S.route==='profile' ? viewProfile()
    : viewDashboard();
  renderModal();
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=ev=>{ev.stopPropagation();handle(el.dataset.act,el);});
  const s=document.querySelector('[data-scrim]');
  if(s)s.onclick=ev=>{if(ev.target===s){modal=null;openTeacher=null;render();}};
  const q=document.getElementById('f-q');
  if(q){q.oninput=ev=>{filters.q=ev.target.value;const p=ev.target.selectionStart;render();
    const n=document.getElementById('f-q');if(n){n.focus();n.setSelectionRange(p,p);}};}
  const fp=document.getElementById('f-path'); if(fp)fp.onchange=ev=>{filters.pathway=ev.target.value;render();};
  const fc=document.getElementById('f-certs'); if(fc)fc.onchange=ev=>{filters.certs=ev.target.value;render();};
  document.querySelectorAll('.simbar [data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  const hints={onboarding:'Sign-up role → wizard. Pathway is written once, at the role step.',
    teacher:'Certificates → "Earn another certificate" → pathway → paywall',
    admin:'Click a row for the enrolment record'};
  document.getElementById('stepnote').textContent=hints[mode]||'';
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(kind){
  S=scenarioState(kind);logs=[];seen={};modal=null;selectedPathway=null;openTeacher=null;ob=null;
  filters={q:'',pathway:'',certs:''};
  buildCohort();
  document.getElementById('logBody').innerHTML='';document.getElementById('logCount').textContent='0';
  log('GET','/api/me/subscription',null,'200',`plan=${S.plan}${S.grandfathered?' grandfathered=true':''}`);
  log('GET','/api/me/enrollments',null,'200',`${S.enrollments.length} enrolment(s)`);
  render();
}
document.getElementById('scenario').onchange=ev=>{const m=mode;boot(ev.target.value);mode=m;render();};
document.getElementById('resetBtn').onclick=()=>{const m=mode;boot(document.getElementById('scenario').value);mode=m;render();};
document.getElementById('logHead').onclick=()=>document.getElementById('log').classList.toggle('open');
document.querySelectorAll('.simbar [data-mode]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; if(mode==='onboarding')startOnboarding(); render();});
boot('legacy');
</script>
</body>
